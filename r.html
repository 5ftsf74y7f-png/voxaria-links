<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Voxaria reminder</title>
<style>
  :root { --bg: #f6f3fb; --ink: #1a1a2e; --soft: #5b5b70; --card: #ffffff; --accent: #7a3fd5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14131c; --ink: #f2f0f7; --soft: #b3b0c2; --card: #1f1e2b; --accent: #b99cf0; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; margin: 16px; padding: 32px 24px; background: var(--card); border-radius: 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.5; color: var(--soft); margin: 0 0 12px; }
  .name { color: var(--accent); font-weight: 700; letter-spacing: 0.04em; margin-bottom: 20px; }
</style>
</head>
<body>
<main>
  <p class="name">VOXARIA</p>
  <h1>Someone sent you a reminder</h1>
  <p>This link opens in the Voxaria app. Open it on a phone that has Voxaria installed and the reminder will be ready to add.</p>
  <p>The reminder is carried inside the link itself. This page does not receive or store it.</p>
</main>
</body>
</html>
